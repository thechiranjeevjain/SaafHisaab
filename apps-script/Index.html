const DEFAULT_WORK_WEEKDAYS = Object.freeze([1, 2, 3, 4, 5, 6]);

function normalizedWorkWeekdays(value) {
  const supplied = Array.isArray(value) ? value : DEFAULT_WORK_WEEKDAYS;
  const days = [...new Set(supplied.map(Number).filter((day) => Number.isInteger(day) && day >= 0 && day <= 6))].sort((a, b) => a - b);
  return days.length ? days : [...DEFAULT_WORK_WEEKDAYS];
}

function scheduledDatesForMonth(month, policy = POLICY) {
  if (!/^\d{4}-\d{2}$/.test(String(month || ''))) return [];
  const [year, monthNumber] = month.split('-').map(Number);
  const daysInMonth = new Date(year, monthNumber, 0).getDate();
  const weekdays = new Set(normalizedWorkWeekdays(policy.workWeekdays));
  const activeFrom = /^\d{4}-\d{2}-\d{2}$/.test(policy.employmentStartDate || '') ? policy.employmentStartDate : '';
  const activeUntil = /^\d{4}-\d{2}-\d{2}$/.test(policy.employmentEndDate || '') ? policy.employmentEndDate : '';
  const dates = [];
  for (let day = 1; day <= daysInMonth; day += 1) {
    const date = `${month}-${String(day).padStart(2, '0')}`;
    if (activeFrom && date < activeFrom) continue;
    if (activeUntil && date > activeUntil) continue;
    if (weekdays.has(new Date(`${date}T12:00:00`).getDay())) dates.push(date);
  }
  return dates;
}

function isScheduledWorkday(date, policy = POLICY) {
  return scheduledDatesForMonth(String(date || '').slice(0, 7), policy).includes(date);
}

function monthReadiness({ dailyLogs = [], policy = POLICY, month, today = dateKey() }) {
  const scheduledDates = scheduledDatesForMonth(month, policy);
  const byDate = new Map(dailyLogs.filter((log) => log.date?.startsWith(month)).map((log) => [log.date, log]));
  const scheduledLogs = scheduledDates.map((date) => byDate.get(date)).filter(Boolean);
  const missingDates = scheduledDates.filter((date) => !byDate.has(date));
  const futureDates = missingDates.filter((date) => date > today);
  const overdueMissingDates = missingDates.filter((date) => date <= today);
  return {
    scheduledDates,
    scheduledCount: scheduledDates.length,
    recordedCount: scheduledLogs.length,
    missingDates,
    missingCount: missingDates.length,
    futureDates,
    futureCount: futureDates.length,
    overdueMissingDates,
    overdueMissingCount: overdueMissingDates.length,
    notRequiredCount: scheduledLogs.filter((log) => log.dayType === 'not_required').length,
    leaveCount: scheduledLogs.filter((log) => log.dayType !== 'not_required' && ['half', 'full'].includes(log.leave)).length,
    normalCount: scheduledLogs.filter((log) => log.dayType !== 'not_required' && (!log.leave || log.leave === 'none')).length,
  };
}

function normalizePhone(value) {
  const raw = String(value || '').trim();
  if (/[^0-9+()\s-]/.test(raw)) throw new Error('Phone number contains unsupported characters.');
  const digits = raw.replace(/\D/g, '');
  if (raw.startsWith('+') && digits.length >= 8 && digits.length <= 15) return `+${digits}`;
  if (digits.length === 10) return `+91${digits}`;
  if (digits.length === 11 && digits.startsWith('0')) return `+91${digits.slice(1)}`;
  if (digits.length === 12 && digits.startsWith('91')) return `+${digits}`;
  throw new Error('Enter a 10-digit Indian phone number or include the country code, for example +919876543210.');
}

function groupPairs(pairs = []) {
  return {
    workingForMe: pairs.filter((pair) => pair.role === 'employer'),
    iWorkFor: pairs.filter((pair) => pair.role === 'worker'),
  };
}

function normalizedActivity(activity, index, workingDays) {
  const cadence = activity?.cadence === 'flexible' ? 'flexible' : 'daily';
  const id = String(activity?.id || `activity_${index + 1}`).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 60);
  return {
    id,
    label: String(activity?.label || `Activity ${index + 1}`).slice(0, 80),
    category: String(activity?.category || 'Other').slice(0, 60),
    cadence,
    monthlyAmount: Math.max(0, Number(activity?.monthlyAmount || 0)),
    expectedPerMonth: cadence === 'daily' ? Math.max(1, Number(workingDays || 26)) : Math.max(1, Number(activity?.expectedPerMonth || 1)),
  };
}

function activityDefinitions(policy = POLICY) {
  const workingDays = Math.max(1, Number(policy.workingDays || POLICY.workingDays));
  if (Array.isArray(policy.activities) && policy.activities.length) {
    return policy.activities.map((activity, index) => normalizedActivity(activity, index, workingDays));
  }
  const amounts = {
    morningCooking: Number(policy.cookingAmount ?? POLICY.cookingAmount) / 2,
    eveningCooking: Number(policy.cookingAmount ?? POLICY.cookingAmount) / 2,
    morningUtensils: Number(policy.utensilsAmount ?? POLICY.utensilsAmount) / 2,
    eveningUtensils: Number(policy.utensilsAmount ?? POLICY.utensilsAmount) / 2,
    floorCleaning: Number(policy.floorInternalAmount ?? POLICY.floorInternalAmount),
    toiletCleaning: Number(policy.toiletInternalAmount ?? POLICY.toiletInternalAmount),
  };
  return DEFAULT_ACTIVITIES.map((activity, index) => normalizedActivity({
    ...activity,
    monthlyAmount: amounts[activity.id],
    expectedPerMonth: activity.id === 'toiletCleaning' ? Number(policy.toiletPerMonth || POLICY.toiletPerMonth) : workingDays,
  }, index, workingDays));
}

function categoryTotals(policy = POLICY) {
  if (policy.categoryAmounts && typeof policy.categoryAmounts === 'object') {
    const supplied = Object.fromEntries(Object.entries(policy.categoryAmounts).map(([key, value]) => [key, Number(value || 0)]));
    if (Object.keys(supplied).length && activityDefinitions(policy).every((activity) => activity.monthlyAmount === 0)) return supplied;
  }
  const totals = {};
  for (const activity of activityDefinitions(policy)) totals[activity.category] = (totals[activity.category] || 0) + activity.monthlyAmount;
  return totals;
}

function rates(policy = POLICY) {
  const byActivity = Object.fromEntries(activityDefinitions(policy).map((activity) => [activity.id, activity.monthlyAmount / activity.expectedPerMonth]));
  return {
    daily: policy.monthlySalary / policy.workingDays,
    byActivity,
    cookingSession: byActivity.morningCooking || 0,
    utensilSession: byActivity.morningUtensils || 0,
    floor: byActivity.floorCleaning || 0,
    toilet: byActivity.toiletCleaning || 0,
  };
}

function calculateMonth({ dailyLogs = [], toiletLogs = [], policy = POLICY, month }) {
  const r = rates(policy);
  const activities = activityDefinitions(policy);
  const confirmedDaily = dailyLogs.filter((x) => x.date?.startsWith(month) && x.approval === 'confirmed');
  const confirmedToilet = toiletLogs.filter((x) => x.month === month && x.approval === 'confirmed');
  let usedValue = 0;
  const audit = [];

  for (const log of confirmedDaily) {
    if (log.leave === 'full') {
      usedValue += r.daily;
      audit.push({ date: log.date, label: 'Full-day leave', value: r.daily });
      continue;
    }
    if (log.leave === 'half') {
      usedValue += r.daily / 2;
      audit.push({ date: log.date, label: 'Half-day leave', value: r.daily / 2 });
      continue;
    }
    for (const activity of activities.filter((item) => item.cadence === 'daily')) {
      const outcome = log.activityOutcomes?.[activity.id] ?? log.tasks?.[activity.id];
      if (outcome !== 'missed') continue;
      const value = r.byActivity[activity.id] || 0;
      usedValue += value;
      audit.push({ date: log.date, label: activity.label, activityId: activity.id, value });
    }
  }

  for (const log of confirmedToilet) {
    if (log.outcome !== 'missed') continue;
    const activity = activities.find((item) => item.id === (log.activityId || 'toiletCleaning')) || activities.find((item) => item.cadence === 'flexible');
    if (!activity) continue;
    const value = r.byActivity[activity.id] || 0;
    usedValue += value;
    audit.push({ date: log.completedDate || `${month} · ${activity.label} ${log.slot}`, label: `${activity.label} ${log.slot}`, activityId: activity.id, value });
  }

  const allowance = policy.paidLeaveDays * r.daily;
  const adjustment = Math.max(0, usedValue - allowance);
  const finalPayment = Math.max(0, policy.monthlySalary - adjustment);
  return { usedValue, allowance, adjustment, finalPayment, audit, rates: r };
}

function salaryPosition({ dailyLogs = [], toiletLogs = [], policy = POLICY, month }) {
  const confirmed = calculateMonth({ dailyLogs, toiletLogs, policy, month });
  const includePending = (entry) => entry.approval === 'pending' ? { ...entry, approval: 'confirmed' } : entry;
  const projected = calculateMonth({
    dailyLogs: dailyLogs.map(includePending),
    toiletLogs: toiletLogs.map(includePending),
    policy,
    month,
  });
  const dailyRate = confirmed.rates.daily || 1;
  return {
    confirmed,
    projected,
    allowanceDays: policy.paidLeaveDays,
    confirmedEquivalentDays: confirmed.usedValue / dailyRate,
    pendingEquivalentDays: Math.max(0, projected.usedValue - confirmed.usedValue) / dailyRate,
    remainingAllowanceDays: Math.max(0, policy.paidLeaveDays - confirmed.usedValue / dailyRate),
    pendingPossibleAdjustment: Math.max(0, projected.adjustment - confirmed.adjustment),
  };
}

function missedActivityRows(dailyLogs = [], toiletLogs = [], month, policy = POLICY) {
  const rows = [];
  const activities = activityDefinitions(policy);
  for (const log of dailyLogs.filter((x) => x.date?.startsWith(month))) {
    if (log.leave === 'full' || log.leave === 'half') {
      rows.push({ date: log.date, label: log.leave === 'full' ? 'Full-day leave' : 'Half-day leave', approval: log.approval, outcome: 'leave' });
    }
    if (log.leave === 'none' || !log.leave) {
      for (const activity of activities.filter((item) => item.cadence === 'daily')) {
        const outcome = log.activityOutcomes?.[activity.id] ?? log.tasks?.[activity.id];
        if (outcome === 'missed') rows.push({ date: log.date, label: activity.label, activityId: activity.id, approval: log.approval, outcome: 'missed' });
      }
    }
  }
  for (const log of toiletLogs.filter((x) => x.month === month && x.outcome === 'missed')) {
    const activity = activities.find((item) => item.id === (log.activityId || 'toiletCleaning')) || { id: log.activityId, label: log.activityLabel || 'Flexible activity' };
    rows.push({ date: log.completedDate || `Occurrence ${log.slot}`, label: `${activity.label} ${log.slot}`, activityId: activity.id, approval: log.approval, outcome: 'missed' });
  }
  return rows.sort((a, b) => String(a.date).localeCompare(String(b.date)));
}

function money(value) {
  return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(Number(value || 0));
}

function monthKey(date = new Date()) {
  const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 7);
}

function dateKey(date = new Date()) {
  const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
}

function sanitizePolicy(profile = {}) {
  const raw = profile.policy || profile;
  const merged = { ...POLICY, ...raw };
  merged.jobProfileName = String(raw.jobProfileName || 'Cook & cleaner').slice(0, 80);
  merged.workWeekdays = normalizedWorkWeekdays(raw.workWeekdays);
  merged.employmentStartDate = /^\d{4}-\d{2}-\d{2}$/.test(raw.employmentStartDate || '') ? raw.employmentStartDate : '';
  merged.employmentEndDate = /^\d{4}-\d{2}-\d{2}$/.test(raw.employmentEndDate || '') ? raw.employmentEndDate : '';
  if (merged.employmentStartDate && merged.employmentEndDate && merged.employmentEndDate < merged.employmentStartDate) merged.employmentEndDate = '';
  merged.activities = activityDefinitions(merged);
  const categories = categoryTotals(merged);
  merged.monthlySalary = Object.values(categories).reduce((sum, value) => sum + value, 0) || Number(raw.monthlySalary || POLICY.monthlySalary);
  merged.cookingAmount = categories.Cooking ?? Number(raw.cookingAmount ?? POLICY.cookingAmount);
  merged.utensilsAmount = categories.Utensils ?? Number(raw.utensilsAmount ?? POLICY.utensilsAmount);
  merged.cleaningAmount = categories.Cleaning ?? Number(raw.cleaningAmount ?? POLICY.cleaningAmount);
  return merged;
}

function policyForMonth(profile = {}, month = monthKey()) {
  const history = Array.isArray(profile.policyHistory) ? profile.policyHistory : [];
  const eligible = history
    .filter((entry) => /^\d{4}-\d{2}$/.test(entry?.effectiveMonth || '') && entry.effectiveMonth <= month)
    .sort((a, b) => a.effectiveMonth.localeCompare(b.effectiveMonth));
  return sanitizePolicy(eligible.at(-1)?.policy || profile.policy || profile);
}

const STORE_KEY = 'saafhisaab.shared-ledger.v2';
const app = document.querySelector('#app');
const toastEl = document.querySelector('#toast');

const state = {
  page: 'today',
  authTab: 'login',
  selectedDate: dateKey(),
  selectedMonth: monthKey(),
  busy: false,
  auth: null,
  connection: null,
  pairs: [],
  pair: null,
  snapshot: null,
  draft: null,
  draftDirty: false,
  openedFromCalendar: false,
  policyDraft: null,
};

function escapeHtml(value = '') {
  return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
}

function loadStore() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    state.auth = saved.auth || null;
    state.connection = saved.connection || null;
    state.pairs = saved.pairs || [];
    state.pair = saved.auth?.mode === 'demo' ? saved.pair || null : null;
    state.snapshot = saved.auth?.mode === 'demo' ? saved.snapshot || null : null;
  } catch (_) {}
}

function saveStore() {
  const saved = { auth: state.auth, connection: state.connection, pairs: state.pairs };
  if (state.auth?.mode === 'demo') { saved.pair = state.pair; saved.snapshot = state.snapshot; }
  localStorage.setItem(STORE_KEY, JSON.stringify(saved));
}

function configuredServiceEndpoint() {
  return String(
    window.SAAF_HISAAB_WEB_APP_URL
    || window.SAAF_HISAAB_API_URL
    || state.connection?.endpoint
    || state.auth?.endpoint
    || ''
  ).trim();
}

function serviceIsReady() {
  return Boolean(window.google?.script?.run || configuredServiceEndpoint());
}

function requireServiceEndpoint() {
  const endpoint = configuredServiceEndpoint();
  if (!window.google?.script?.run && !endpoint) {
    throw new Error('This installation is not connected to the SaafHisaab service. Ask the app administrator for an updated build.');
  }
  return endpoint;
}

function toast(message, error = false) {
  toastEl.textContent = message;
  toastEl.className = `toast show${error ? ' error' : ''}`;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { toastEl.className = 'toast'; }, 3100);
}

function roleName(role = state.pair?.role || state.auth?.role) {
  return role === 'employer' ? 'Homeowner' : 'Worker';
}

function defaultSnapshot(pairId = 'demo-home') {
  return {
    profile: {
      householdId: pairId,
      employerName: 'Homeowner',
      workerName: 'Worker',
      policy: { ...POLICY },
    },
    dailyLogs: [],
    toiletLogs: [],
    expenses: [],
    requests: [],
    payments: [],
    audit: [],
    monthSummaries: {},
    syncedAt: new Date().toISOString(),
  };
}

function makeDraft(date = state.selectedDate) {
  const existing = state.snapshot?.dailyLogs?.find((x) => x.date === date);
  const activities = activityDefinitions(policy(date.slice(0, 7))).filter((item) => item.cadence === 'daily');
  if (existing) {
    const copy = structuredClone(existing);
    copy.dayType = copy.dayType === 'not_required' ? 'not_required' : 'expected';
    copy.activityOutcomes = { ...Object.fromEntries(activities.map((item) => [item.id, 'done'])), ...(copy.tasks || {}), ...(copy.activityOutcomes || {}) };
    return copy;
  }
  return {
    id: uid('day'), date, arrivalTime: '', departureTime: '', calls: 0, messages: 0,
    dayType: 'expected', leave: 'none', leaveNotice: '', activityOutcomes: Object.fromEntries(activities.map((item) => [item.id, 'done'])), note: '',
  };
}

function syncDraftFromDailyForm() {
  const form = document.querySelector('#dailyForm');
  if (!form || !state.draft) return;
  const data = new FormData(form);
  state.draft.arrivalTime = data.get('arrivalTime') || '';
  state.draft.departureTime = data.get('departureTime') || '';
  state.draft.calls = Number(data.get('calls') || 0);
  state.draft.messages = Number(data.get('messages') || 0);
  state.draft.dayType = data.get('dayType') === 'not_required' ? 'not_required' : 'expected';
  state.draft.leave = data.get('leave') || 'none';
  state.draft.leaveNotice = data.get('leaveNotice') || '';
  state.draft.note = data.get('note') || '';
}

function monthLabel(value) {
  if (!/^\d{4}-\d{2}$/.test(value || '')) return value || '';
  return new Intl.DateTimeFormat('en-IN', { month: 'long', year: 'numeric' }).format(new Date(`${value}-01T12:00:00`));
}

function prettyDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return value || '—';
  return new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(`${value}T12:00:00`));
}

function approvalPill(status = 'pending') {
  return `<span class="status-pill ${escapeHtml(status)}">${escapeHtml(status.replace('_', ' '))}</span>`;
}

function inviteEncode(payload) {
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  let binary = '';
  bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
  return `SH1.${btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
}

function inviteDecode(value) {
  const raw = String(value || '').trim();
  if (!raw.startsWith('SH1.')) throw new Error('This is not a valid SaafHisaab invitation.');
  const base = raw.slice(4).replace(/-/g, '+').replace(/_/g, '/');
  const binary = atob(base.padEnd(Math.ceil(base.length / 4) * 4, '='));
  const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

async function api(action, payload = {}, useAuth = true) {
  if (state.auth?.mode === 'demo') return demoApi(action, payload);
  const pairActions = ['snapshot', 'saveDaily', 'saveBulkLeaves', 'saveBulkCompleted', 'saveToilet', 'saveExpense', 'updatePolicy', 'submitRequest', 'reviewRequest', 'reviewEntry', 'lockMonth', 'acknowledgePayment'];
  if (pairActions.includes(action) && state.pair?.pairId && !payload.pairId) payload = { ...payload, pairId: state.pair.pairId };
  const endpoint = payload.endpoint || configuredServiceEndpoint();
  const body = { action, payload };
  if (useAuth && state.auth?.token) body.token = state.auth.token;
  if (window.google?.script?.run) {
    return new Promise((resolve, reject) => {
      window.google.script.run
        .withSuccessHandler((result) => result?.ok ? resolve(result.data) : reject(new Error(result?.error || 'Request failed.')))
        .withFailureHandler((error) => reject(new Error(error?.message || 'Google Apps Script request failed.')))
        .apiRequest(JSON.stringify(body));
    });
  }
  if (!endpoint) throw new Error('Google Apps Script URL is missing.');
  const response = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow',
  });
  const text = await response.text();
  let result;
  try { result = JSON.parse(text); } catch (_) { throw new Error('The Google service returned an unreadable response. Check the deployment URL.'); }
  if (!result.ok) throw new Error(result.error || 'Request failed.');
  return result.data;
}

function addAudit(action, detail) {
  state.snapshot.audit.unshift({ id: uid('audit'), at: new Date().toISOString(), role: state.pair?.role || state.auth.role, action, detail });
}

async function demoApi(action, payload) {
  const snap = state.snapshot || defaultSnapshot();
  if (action === 'snapshot') return snap;
  if (action === 'saveDaily') {
    if (state.pair.role !== 'employer') throw new Error('Workers submit requests instead of changing payroll records.');
    const log = { ...payload.log, createdBy: state.pair.role, approval: 'pending', updatedAt: new Date().toISOString() };
    const index = snap.dailyLogs.findIndex((x) => x.id === log.id || x.date === log.date);
    if (index >= 0) snap.dailyLogs[index] = log; else snap.dailyLogs.push(log);
    addAudit('Saved daily log', log.date);
  }
  if (action === 'saveToilet') {
    if (state.pair.role !== 'employer') throw new Error('Workers submit requests instead of changing payroll records.');
    const log = { ...payload.log, createdBy: state.pair.role, approval: 'pending', updatedAt: new Date().toISOString() };
    const index = snap.toiletLogs.findIndex((x) => x.id === log.id || (x.month === log.month && (x.activityId || 'toiletCleaning') === (log.activityId || 'toiletCleaning') && Number(x.slot) === Number(log.slot)));
    if (index >= 0) snap.toiletLogs[index] = log; else snap.toiletLogs.push(log);
    addAudit('Saved toilet log', `${log.month} window ${log.slot}`);
  }
  if (action === 'saveExpense') {
    if (state.pair.role !== 'employer') throw new Error('Only the homeowner can manage household expenses.');
    const expense = { ...payload.expense, id: payload.expense.id || uid('expense'), createdBy: 'employer', updatedAt: new Date().toISOString() };
    const index = (snap.expenses ||= []).findIndex((item) => item.id === expense.id);
    if (index >= 0) snap.expenses[index] = expense; else snap.expenses.push(expense);
    addAudit('Saved household expense', `${expense.date} ${expense.category} ${expense.amount}`);
  }
  if (action === 'saveBulkLeaves') {
    if (state.pair.role !== 'employer') throw new Error('Only the homeowner can record payroll entries.');
    for (const leave of payload.leaves || []) {
      const existing = snap.dailyLogs.find((item) => item.date === leave.date);
      if (existing && existing.createdBy && existing.createdBy !== 'employer') throw new Error(`A worker-created record already exists for ${leave.date}.`);
      const activities = activityDefinitions(policy(leave.date.slice(0, 7))).filter((item) => item.cadence === 'daily');
      const log = existing || { id: uid('day'), date: leave.date, activityOutcomes: Object.fromEntries(activities.map((item) => [item.id, 'done'])), createdAt: new Date().toISOString() };
      Object.assign(log, { dayType: 'expected', leave: leave.leave, leaveNotice: leave.leaveNotice, note: leave.note || '', createdBy: 'employer', approval: 'pending', confirmedBy: '', updatedAt: new Date().toISOString() });
      if (!existing) snap.dailyLogs.push(log);
      addAudit('Saved bulk leave', leave.date);
    }
  }
  if (action === 'saveBulkCompleted') {
    if (state.pair.role !== 'employer') throw new Error('Only the homeowner can record payroll entries.');
    const seen = new Set(), prepared = [];
    for (const date of payload.dates || []) {
      if (seen.has(date)) continue;
      seen.add(date);
      if (!isScheduledWorkday(date, policy(date.slice(0, 7)))) throw new Error(`${prettyDate(date)} is not an expected workday.`);
      if (snap.dailyLogs.some((item) => item.date === date)) throw new Error(`A record already exists for ${prettyDate(date)}.`);
      const activities = activityDefinitions(policy(date.slice(0, 7))).filter((item) => item.cadence === 'daily');
      prepared.push({ id: uid('day'), date, dayType: 'expected', leave: 'none', leaveNotice: '', activityOutcomes: Object.fromEntries(activities.map((item) => [item.id, 'done'])), note: payload.note || '', createdBy: 'employer', approval: 'pending', confirmedBy: '', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    }
    for (const log of prepared) {
      snap.dailyLogs.push(log);
      const { date } = log;
      addAudit('Saved bulk completion', date);
    }
  }
  if (action === 'updatePolicy') {
    if (state.pair.role !== 'employer') throw new Error('Only the homeowner can change agreement rates.');
    const version = { id: uid('policy'), effectiveMonth: payload.effectiveMonth, policy: sanitizePolicy(payload.policy), createdAt: new Date().toISOString() };
    const history = (snap.profile.policyHistory || []).filter((item) => item.effectiveMonth !== version.effectiveMonth);
    history.push(version);
    snap.profile.policyHistory = history.sort((a, b) => a.effectiveMonth.localeCompare(b.effectiveMonth));
    snap.profile.policy = policyForMonth(snap.profile, monthKey());
    snap.monthSummaries = {};
    snap.monthPositions = {};
    addAudit('Updated agreement rates', version.effectiveMonth);
  }
  if (action === 'submitRequest') {
    if (state.pair.role !== 'worker') throw new Error('Only the worker can submit this request.');
    snap.requests ||= [];
    snap.requests.push({ ...payload.request, id: payload.request.id || uid('request'), type: 'leave', createdBy: 'worker', status: 'pending', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    addAudit('Submitted leave request', payload.request.date);
  }
  if (action === 'reviewRequest') {
    if (state.pair.role !== 'employer') throw new Error('Only the homeowner can review requests.');
    const request = (snap.requests || []).find((item) => item.id === payload.id);
    if (!request || request.status !== 'pending') throw new Error('Pending request was not found.');
    request.status = payload.decision;
    request.reviewedBy = 'employer';
    request.updatedAt = new Date().toISOString();
    if (payload.decision === 'accepted') {
      const activities = activityDefinitions(policy(request.date.slice(0, 7))).filter((item) => item.cadence === 'daily');
      const log = snap.dailyLogs.find((item) => item.date === request.date) || { id: uid('day'), date: request.date, activityOutcomes: Object.fromEntries(activities.map((item) => [item.id, 'done'])), createdAt: new Date().toISOString() };
      Object.assign(log, { dayType: 'expected', leave: request.leave, leaveNotice: request.leaveNotice, note: request.note || '', createdBy: 'worker', approval: 'confirmed', confirmedBy: 'employer', updatedAt: new Date().toISOString() });
      if (!snap.dailyLogs.some((item) => item.id === log.id)) snap.dailyLogs.push(log);
    }
    addAudit(`${payload.decision} worker request`, request.date);
  }
  if (action === 'reviewEntry') {
    const list = payload.entity === 'toilet' ? snap.toiletLogs : snap.dailyLogs;
    const item = list.find((x) => x.id === payload.id);
    if (!item) throw new Error('Entry was not found.');
    if (item.createdBy === state.pair.role) throw new Error('The other person must review this entry.');
    item.approval = payload.decision;
    item.confirmedBy = state.pair.role;
    item.updatedAt = new Date().toISOString();
    addAudit(`${payload.decision} entry`, item.date || `${item.month} toilet ${item.slot}`);
  }
  if (action === 'lockMonth') {
    if (state.pair.role !== 'employer') throw new Error('Only the homeowner can lock a month.');
    const open = [...snap.dailyLogs.filter((x) => x.date?.startsWith(payload.month)), ...snap.toiletLogs.filter((x) => x.month === payload.month)].filter((x) => x.approval !== 'confirmed');
    if (open.length) throw new Error('Resolve all pending or disputed entries before locking the month.');
    const effectivePolicy = policyForMonth(snap.profile, payload.month);
    const readiness = monthReadiness({ dailyLogs: snap.dailyLogs, policy: effectivePolicy, month: payload.month });
    if (readiness.missingCount) throw new Error(`Record or mark not required all expected workdays. ${readiness.missingCount} date${readiness.missingCount === 1 ? ' is' : 's are'} still missing.`);
    const calc = calculateMonth({ ...snap, policy: effectivePolicy, month: payload.month });
    const payment = { month: payload.month, baseSalary: effectivePolicy.monthlySalary, adjustment: calc.adjustment, finalPayment: calc.finalPayment, status: 'locked', lockedAt: new Date().toISOString() };
    const index = snap.payments.findIndex((x) => x.month === payload.month);
    if (index >= 0) snap.payments[index] = payment; else snap.payments.push(payment);
    addAudit('Locked month', payload.month);
  }
  if (action === 'acknowledgePayment') {
    if (state.pair.role !== 'worker') throw new Error('Only the worker can acknowledge the payment.');
    const payment = snap.payments.find((x) => x.month === payload.month);
    if (!payment) throw new Error('The homeowner has not locked this month yet.');
    payment.status = 'acknowledged';
    payment.acknowledgedAt = new Date().toISOString();
    addAudit('Acknowledged payment', payload.month);
  }
  snap.syncedAt = new Date().toISOString();
  saveStore();
  return snap;
}

async function refresh(showToast = false) {
  if (!state.auth) return;
  if (state.draftDirty && state.page === 'today') {
    if (showToast) toast('Save or change the date before syncing. Your edits are still here.', true);
    return;
  }
  state.busy = true;
  render();
  try {
    if (state.pair) {
      state.snapshot = await api('snapshot');
      state.snapshot.syncedAt = new Date().toISOString();
      state.draft = makeDraft();
      state.draftDirty = false;
    } else {
      const data = await api('listPairs');
      state.pairs = data.pairs || [];
    }
    saveStore();
    if (showToast) toast(state.pair ? 'Ledger updated.' : 'People list updated.');
  } catch (error) {
    toast(error.message, true);
  } finally {
    state.busy = false;
    render();
  }
}

function base64BackupFile(data) {
  const binary = atob(data.base64), bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
  return new File([bytes], data.fileName, { type: data.mimeType || 'application/gzip' });
}

function downloadBase64File(data) {
  const file = base64BackupFile(data);
  const url = URL.createObjectURL(file);
  const link = document.createElement('a'); link.href = url; link.download = data.fileName; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function nativePlugin(name) {
  const bridge = window.Capacitor;
  if (!bridge?.isNativePlatform?.() || !bridge.registerPlugin) return null;
  return bridge.Plugins?.[name] || bridge.registerPlugin(name);
}

async function saveBackupToPersonalDrive(data) {
  const filesystem = nativePlugin('Filesystem'), share = nativePlugin('Share');
  if (filesystem && share) {
    const path = `backups/${data.fileName}`;
    const saved = await filesystem.writeFile({ path, data: data.base64, directory: 'CACHE', recursive: true });
    const fileUri = saved.uri || (await filesystem.getUri({ path, directory: 'CACHE' })).uri;
    toast('Choose Google Drive and the homeowner account.');
    await share.share({
      title: 'SaafHisaab homeowner backup',
      text: 'Save this compressed SaafHisaab backup to your Google Drive.',
      files: [fileUri],
      dialogTitle: 'Save backup to Google Drive',
    });
    return 'shared';
  }
  const file = base64BackupFile(data);
  if (navigator.share && navigator.canShare?.({ files: [file] })) {
    toast('Choose Google Drive and the homeowner account.');
    try {
      await navigator.share({ title: 'SaafHisaab homeowner backup', text: 'Save this compressed SaafHisaab backup to your Google Drive.', files: [file] });
      return 'shared';
    } catch (error) {
      if (error?.name === 'AbortError') return 'cancelled';
      throw error;
    }
  }
  downloadBase64File(data);
  return 'downloaded';
}

function policy(month = state.selectedMonth) { return policyForMonth(state.snapshot?.profile || {}, month); }

function activitiesForMonth(month = state.selectedMonth) { return activityDefinitions(policy(month)); }
function dailyActivities(month = state.selectedMonth) { return activitiesForMonth(month).filter((item) => item.cadence === 'daily'); }
function flexibleActivities(month = state.selectedMonth) { return activitiesForMonth(month).filter((item) => item.cadence === 'flexible'); }

function calcForMonth(month = state.selectedMonth) {
  const remote = state.snapshot?.monthSummaries?.[month];
  if (remote) return remote;
  return calculateMonth({ dailyLogs: state.snapshot?.dailyLogs || [], toiletLogs: state.snapshot?.toiletLogs || [], policy: policy(month), month });
}

function positionForMonth(month = state.selectedMonth) {
  const remote = state.snapshot?.monthPositions?.[month];
  if (remote) return remote;
  return salaryPosition({
    dailyLogs: state.snapshot?.dailyLogs || [],
    toiletLogs: state.snapshot?.toiletLogs || [],
    policy: policy(month),
    month,
  });
}

function decimalDays(value) {
  return Number(value || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
}

function relativeUpdatedTime() {
  const at = new Date(state.snapshot?.syncedAt || 0).getTime();
  if (!at) return 'Not synced yet';
  const seconds = Math.max(0, Math.round((Date.now() - at) / 1000));
  if (seconds < 10) return 'Updated just now';
  if (seconds < 60) return `Updated ${seconds} seconds ago`;
  const minutes = Math.round(seconds / 60);
  return minutes < 60 ? `Updated ${minutes} minute${minutes === 1 ? '' : 's'} ago` : `Updated ${new Date(at).toLocaleString('en-IN')}`;
}

function renderMonthCalendar() {
  const [year, month] = state.selectedMonth.split('-').map(Number);
  const days = new Date(year, month, 0).getDate();
  const first = new Date(year, month - 1, 1).getDay();
  const logs = state.snapshot.dailyLogs.filter((item) => item.date?.startsWith(state.selectedMonth));
  const scheduled = new Set(scheduledDatesForMonth(state.selectedMonth, policy(state.selectedMonth)));
  const cells = Array.from({ length: first }, () => '<span class="calendar-day blank"></span>');
  for (let day = 1; day <= days; day += 1) {
    const date = `${state.selectedMonth}-${String(day).padStart(2, '0')}`;
    const log = logs.find((item) => item.date === date);
    let status = scheduled.has(date) ? 'unrecorded' : 'off', label = scheduled.has(date) ? 'Expected · unrecorded' : 'Weekly off / outside active dates';
    if (log?.approval === 'disputed') { status = 'disputed'; label = 'Disputed'; }
    else if (log?.approval === 'pending') { status = 'pending'; label = 'Pending'; }
    else if (log?.dayType === 'not_required') { status = 'not-required'; label = 'Not required'; }
    else if (log?.leave === 'full' || log?.leave === 'half') { status = 'leave'; label = log.leave === 'full' ? 'Full leave' : 'Half leave'; }
    else if (log && dailyActivities(state.selectedMonth).some((activity) => (log.activityOutcomes?.[activity.id] ?? log.tasks?.[activity.id]) === 'missed')) { status = 'missed'; label = 'Missed activity'; }
    else if (log) { status = 'done'; label = 'Completed'; }
    const marker = status === 'done' ? '✓' : status === 'pending' ? '…' : status === 'leave' ? 'L' : status === 'missed' ? '!' : status === 'disputed' ? '?' : status === 'not-required' ? 'N' : status === 'off' ? '–' : '○';
    cells.push(`<button class="calendar-day ${status}" data-calendar-date="${date}" title="${escapeHtml(label)}" aria-label="${escapeHtml(`${prettyDate(date)}: ${label}`)}"><span>${day}</span><i aria-hidden="true">${marker}</i></button>`);
  }
  return `<section class="card"><div class="calendar-head"><div><h2>Workday calendar</h2><p class="card-sub">Expected dates are outlined. Weekly offs and dates outside employment stay muted.</p></div><div class="calendar-legend"><span class="done">Done</span><span class="pending">Pending</span><span class="unrecorded">Unrecorded</span><span class="missed">Miss/leave</span></div></div><div class="calendar-week"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="calendar-grid">${cells.join('')}</div></section>`;
}
